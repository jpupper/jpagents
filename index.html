<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JP Agents - Ollama Powered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>JP<span>Agents</span></h1>
          <button id="new-chat" class="btn-primary">+ Nuevo Proyecto</button>
        </div>
        <div id="chat-list" class="chat-list">
          <!-- Chat sessions will appear here -->
        </div>
        <div class="sidebar-footer">
          <div class="status-indicator">
            <span class="dot"></span> Ollama Live
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-nav">
          <div class="config-group">
            <label>Modelo:</label>
            <select id="model-select">
              <option value="">Cargando modelos...</option>
            </select>
          </div>
          <div class="config-group folder-selector">
            <label>Carpeta:</label>
            <input type="text" id="folder-path" placeholder="C:/Ruta/Al/Proyecto" />
            <button id="scan-folder" class="btn-icon" title="Cargar archivos">📁</button>
          </div>
        </header>

        <section id="chat-window" class="chat-window">
          <div id="chat-messages" class="chat-messages">
            <div class="welcome-screen">
              <h2>¿Qué vamos a construir hoy?</h2>
              <p>Selecciona un modelo y una carpeta para empezar a trabajar con tus subagentes.</p>
            </div>
          </div>
          
          <div class="input-area">
            <div class="input-wrapper">
              <textarea id="chat-input" placeholder="Escribe una instrucción para el agente..." rows="1"></textarea>
              <button id="send-btn" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </section>
      </main>

      <aside class="file-explorer">
        <h3>Archivos del Proyecto</h3>
        <div id="file-list" class="file-list">
          <p class="empty-state">No hay carpeta seleccionada</p>
        </div>
      </aside>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
